<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV TƯỢNG V3</title><style>
:root{--b:#1670e8;--g:#12a05c;--r:#d92d20;--bg:#f5f7fb;--tx:#172033;--mut:#667085}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--tx)}header{background:linear-gradient(135deg,#1466df,#20a1ed);color:#fff;padding:18px}.wrap{max-width:1200px;margin:auto;padding:0 14px}.brand{font-size:27px;font-weight:800}
nav{background:#fff;position:sticky;top:0;z-index:4;border-bottom:1px solid #e5e7eb}.tabs{display:flex;gap:6px;overflow:auto;padding:9px 14px}.tab,button{border:0;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer}.tab{background:#edf3ff;color:#2456a6;white-space:nowrap}.tab.on,.primary{background:var(--b);color:#fff}.page{padding:18px 14px}.cards,.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}.card,.panel{background:#fff;border-radius:13px;padding:14px;box-shadow:0 2px 10px #0000000d}.num{font-size:25px;font-weight:800;margin-top:4px}.mut{font-size:13px;color:var(--mut)}h2{margin:0 0 13px}h3{margin:0 0 10px}
input,select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.table{overflow:auto;margin-top:12px;border-radius:13px}table{width:100%;border-collapse:collapse;background:#fff;min-width:700px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#f8fafc}.red{color:var(--r)}.green{color:var(--g)}.badge{padding:3px 7px;border-radius:99px;background:#e9f8ef;color:#08783f;font-weight:bold;font-size:11px}.note{margin-top:12px;padding:12px;border-radius:9px;background:#fff4d5;border-left:4px solid #f79009}.danger{background:#fee4e2;color:#b42318}.secondary{background:#eef2f6;color:#344054}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
@media(max-width:600px){.brand{font-size:22px}.num{font-size:21px}.page{padding:14px 10px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header><div class="wrap"><div class=brand>🎨 TV TƯỢNG</div><div>Quản lý sản xuất • vật tư • combo • kệ • ký gửi • đối soát • công nợ</div></div></header>
<nav><div class="wrap tabs" id=tabs></div></nav><main class="wrap page" id=main></main>
<script>
const menus=["Tổng quan","Sản phẩm","Nhập kho","Kho","Combo","Điểm bán","Kệ","Ký gửi","Đối soát","Thu tiền","Báo cáo","Dữ liệu","Kết nối"];
const clone=x=>JSON.parse(JSON.stringify(x)), money=n=>(+n||0).toLocaleString("vi-VN")+"đ", today=()=>new Date().toLocaleDateString("vi-VN");
const seed={products:[
{id:1,code:"TT-MINI-001",name:"Tượng Mini",cat:"Tượng",unit:"con",cost:3000,price:15000,share:4000,stock:100,min:20},
{id:2,code:"TT-S-002",name:"Tượng tiêu chuẩn",cat:"Tượng",unit:"con",cost:5000,price:20000,share:5000,stock:100,min:20},
{id:3,code:"TT-L-003",name:"Tượng lớn",cat:"Tượng",unit:"con",cost:8000,price:30000,share:7000,stock:50,min:10},
{id:4,code:"MAU-06",name:"Bộ màu 6 màu",cat:"Màu",unit:"bộ",cost:3500,price:8000,share:2000,stock:80,min:20},
{id:5,code:"MAU-12",name:"Bộ màu 12 màu",cat:"Màu",unit:"bộ",cost:6500,price:15000,share:3000,stock:40,min:10},
{id:6,code:"CO-01",name:"Cọ vẽ",cat:"Cọ/Bút",unit:"cây",cost:1000,price:3000,share:500,stock:150,min:30},
{id:7,code:"KHAY-01",name:"Khay pha màu",cat:"Khay",unit:"cái",cost:1500,price:4000,share:500,stock:60,min:15},
{id:8,code:"TUI-01",name:"Túi/bao bì",cat:"Bao bì",unit:"cái",cost:800,price:0,share:0,stock:200,min:50}],
stores:Array.from({length:10},(_,i)=>({id:i+1,name:"Điểm bán "+(i+1),area:["Yên Thành","Diễn Châu","TP Vinh","Nghi Lộc","Cửa Lò"][i%5],phone:"",debt:0})),
racks:[],receipts:[],moves:[],recs:[],pays:[],ss:{},combos:[
{id:101,code:"COMBO-01",name:"Combo Mini mang về",price:20000,share:5000,bom:[{pid:1,qty:1},{pid:4,qty:1},{pid:6,qty:1},{pid:8,qty:1}]},
{id:102,code:"COMBO-02",name:"Combo Kids",price:30000,share:7000,bom:[{pid:2,qty:1},{pid:4,qty:1},{pid:6,qty:1},{pid:7,qty:1},{pid:8,qty:1}]}]};
let db=JSON.parse(localStorage.getItem("tvtuong-v2")||"null")||clone(seed), page="Tổng quan";
const SB_URL="https://upropxmltqqexvtnuerg.supabase.co"; let sb=null,sbUser=null;
function sbKey(){return localStorage.getItem("tvtuong-supabase-publishable")||""}
function initSB(){if(!sbKey())return false;try{sb=window.supabase.createClient(SB_URL,sbKey());return true}catch(e){return false}}
async function testSB(){if(!initSB())return {ok:false,msg:"Chưa có Publishable key"};try{let {data,error}=await sb.from("products").select("*").limit(3);if(error)throw error;return {ok:true,msg:"Kết nối thành công • đọc được "+data.length+" sản phẩm",data}}catch(e){return {ok:false,msg:e.message}}
async function loadProductsSB(){if(!initSB())return;let {data,error}=await sb.from("products").select("*");if(error)return; if(data?.length){db.products=data.map((x,i)=>({id:x.id??i+1,code:x.code??x.sku??"",name:x.name??"",cat:x.category??x.cat??"Khác",unit:x.unit??"cái",cost:+(x.cost_price??x.cost??0),price:+(x.retail_price??x.price??0),share:+(x.store_share??x.share??0),stock:+(x.stock??x.quantity??0),min:+(x.min_stock??x.min??0)}));localStorage.setItem("tvtuong-v2",JSON.stringify(db));render()}}
async function loginSB(){if(!initSB())return alert("Hãy lưu Publishable key trước.");let email=document.getElementById("sbemail").value.trim(),password=document.getElementById("sbpass").value;if(!email||!password)return alert("Nhập email và mật khẩu Supabase.");let {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return alert("Đăng nhập chưa thành công: "+error.message);sbUser=data.user;await loadProductsSB();alert("Đăng nhập thành công và đã đồng bộ sản phẩm.");render()}
async function logoutSB(){if(sb)await sb.auth.signOut();sbUser=null;render()}
const sn=id=>db.stores.find(x=>x.id==id)?.name||"", pn=id=>db.products.find(x=>x.id==id)?.name||"", p=id=>db.products.find(x=>x.id==id);
function save(){localStorage.setItem("tvtuong-v2",JSON.stringify(db));render()} function go(x){page=x;render()}
function opts(a,l){return a.map(x=>`<option value="${x.id}">${l(x)}</option>`).join("")}
function card(a,b,c=""){return `<div class=card><div class=mut>${a}</div><div class="num ${c}">${b}</div></div>`}
function render(){
tabs.innerHTML=menus.map(x=>`<button class="tab ${x==page?'on':''}" onclick="go('${x}')">${x}</button>`).join("");
let sold=db.recs.reduce((a,x)=>a+x.sold,0),debt=db.stores.reduce((a,x)=>a+x.debt,0),paid=db.pays.reduce((a,x)=>a+x.amount,0),h="";
if(page=="Tổng quan")h=`<h2>Tổng quan</h2><div class=cards>${card("Điểm bán",db.stores.length)+card("Kệ đang đặt",db.racks.length)+card("SKU sản phẩm",db.products.length)+card("Tổng tồn kho",db.products.reduce((a,x)=>a+x.stock,0))+card("Đã bán",sold)+card("Công nợ",money(debt),"red")}</div><div class=note><b>Luồng chuẩn:</b> Nhập/Sản xuất → Kho → Đóng Combo → Giao ký gửi → Đối soát → Thu tiền → Báo cáo.</div>`;
if(page=="Sản phẩm")h=`<h2>Danh mục sản phẩm</h2><div class=panel><h3>＋ Thêm sản phẩm mới</h3><div class=form><input id=code placeholder="Mã SP"><input id=name placeholder="Tên sản phẩm"><select id=cat>${["Tượng","Màu","Cọ/Bút","Khay","Cốc","Bao bì","Phụ kiện","Khác"].map(x=>`<option>${x}</option>`)}</select><input id=unit placeholder="ĐVT: con/bộ/cây..." value="cái"><input id=cost type=number placeholder="Giá vốn"><input id=price type=number placeholder="Giá bán"><input id=share type=number placeholder="Điểm bán hưởng"><input id=min type=number placeholder="Tồn tối thiểu"><button class=primary onclick=addProduct()>Lưu sản phẩm</button></div></div><div class=table><table><tr><th>Mã</th><th>Tên</th><th>Nhóm</th><th>ĐVT</th><th>Giá vốn</th><th>Giá bán</th><th>Điểm hưởng</th><th>Tồn</th><th></th></tr>${db.products.map(x=>`<tr><td>${x.code}</td><td><b>${x.name}</b></td><td>${x.cat}</td><td>${x.unit}</td><td>${money(x.cost)}</td><td>${money(x.price)}</td><td>${money(x.share)}</td><td>${x.stock}</td><td><button class=danger onclick=delProduct(${x.id})>Xóa</button></td></tr>`).join("")}</table></div>`;
if(page=="Nhập kho")h=`<h2>Nhập hàng / sản xuất</h2><div class=panel><div class=form><select id=rpid>${opts(db.products,x=>x.code+" - "+x.name)}</select><input id=rqty type=number placeholder="Số lượng"><select id=rtype><option>Sản xuất</option><option>Mua nhà cung cấp</option><option>Hàng trả về</option><option>Điều chỉnh tăng</option></select><input id=rsupplier placeholder="Nhà cung cấp/Ghi chú"><button class=primary onclick=receipt()>Nhập kho</button></div></div><div class=table><table><tr><th>Ngày</th><th>SP</th><th>SL</th><th>Nguồn</th><th>Ghi chú</th></tr>${[...db.receipts].reverse().map(x=>`<tr><td>${x.date}</td><td>${pn(x.pid)}</td><td>${x.qty}</td><td>${x.type}</td><td>${x.note}</td></tr>`).join("")}</table></div>`;
if(page=="Kho")h=`<h2>Tồn kho</h2><div class=cards>${db.products.map(x=>card(x.name,x.stock+" "+x.unit,x.stock<=x.min?"red":"green")).join("")}</div><div class=note>🔔 Màu đỏ = đã chạm mức tồn tối thiểu, cần sản xuất hoặc nhập thêm.</div>`;
if(page=="Combo")h=`<h2>Combo sản phẩm</h2><div class=panel><h3>Đóng combo từ vật tư</h3><div class=form><select id=cbid>${opts(db.combos,x=>x.code+" - "+x.name)}</select><input id=cbqty type=number placeholder="Số combo cần đóng"><button class=primary onclick=buildCombo()>Kiểm tra & đóng</button></div></div><div class=table><table><tr><th>Mã</th><th>Combo</th><th>Cấu thành</th><th>Giá bán</th><th>Điểm hưởng</th><th>Giá vốn hiện tại</th></tr>${db.combos.map(c=>`<tr><td>${c.code}</td><td><b>${c.name}</b></td><td>${c.bom.map(b=>b.qty+"× "+pn(b.pid)).join("<br>")}</td><td>${money(c.price)}</td><td>${money(c.share)}</td><td>${money(c.bom.reduce((a,b)=>a+p(b.pid).cost*b.qty,0))}</td></tr>`).join("")}</table></div><div class=note>V2 quản lý định mức Combo. Khi đóng combo, app kiểm tra và trừ đúng tượng, màu, cọ, khay, bao bì cấu thành.</div>`;
if(page=="Điểm bán")h=`<h2>Điểm bán</h2><div class=panel><div class=form><input id=sname placeholder="Tên cửa hàng"><input id=area placeholder="Khu vực"><input id=phone placeholder="Liên hệ"><button class=primary onclick=addStore()>Thêm điểm bán</button></div></div><div class=table><table><tr><th>Điểm</th><th>Khu vực</th><th>Liên hệ</th><th>Kệ</th><th>Hàng giữ</th><th>Công nợ</th></tr>${db.stores.map(s=>`<tr><td><b>${s.name}</b></td><td>${s.area}</td><td>${s.phone}</td><td>${db.racks.filter(r=>r.sid==s.id).length}</td><td>${Object.entries(db.ss).filter(([k])=>k.startsWith(s.id+"-")).reduce((a,[,v])=>a+v,0)}</td><td class=red>${money(s.debt)}</td></tr>`).join("")}</table></div>`;
if(page=="Kệ")h=`<h2>Kệ / tài sản cho mượn</h2><div class=panel><div class=form><input id=rcode placeholder="Mã kệ K001"><select id=ksid>${opts(db.stores,x=>x.name)}</select><input id=kvalue type=number value=600000><input id=kdep type=number value=0 placeholder="Tiền cọc"><button class=primary onclick=addRack()>Bàn giao kệ</button></div></div><div class=table><table><tr><th>Mã</th><th>Điểm đặt</th><th>Giá trị</th><th>Cọc</th><th>Trạng thái</th></tr>${db.racks.map(r=>`<tr><td>${r.code}</td><td>${sn(r.sid)}</td><td>${money(r.value)}</td><td>${money(r.dep)}</td><td><span class=badge>Đang cho mượn</span></td></tr>`).join("")}</table></div>`;
if(page=="Ký gửi")h=`<h2>Giao hàng ký gửi</h2><div class=panel><div class=form><select id=msid>${opts(db.stores,x=>x.name)}</select><select id=mpid>${opts(db.products,x=>x.code+" - "+x.name)}</select><input id=mqty type=number placeholder="Số lượng giao"><button class=primary onclick=move()>Giao hàng</button></div></div><div class=table><table><tr><th>Ngày</th><th>Điểm</th><th>Sản phẩm</th><th>SL giao</th></tr>${[...db.moves].reverse().map(x=>`<tr><td>${x.date}</td><td>${sn(x.sid)}</td><td>${pn(x.pid)}</td><td>${x.qty}</td></tr>`).join("")}</table></div>`;
if(page=="Đối soát")h=`<h2>Đối soát bán hàng</h2><div class=panel><div class=form><select id=osid>${opts(db.stores,x=>x.name)}</select><select id=opid>${opts(db.products.filter(x=>x.price>0),x=>x.name)}</select><input id=osold type=number placeholder="Đã bán"><input id=obroken type=number value=0 placeholder="Hỏng/vỡ"><button class=primary onclick=reconcile()>Xác nhận</button></div></div><div class=table><table><tr><th>Ngày</th><th>Điểm</th><th>SP</th><th>Bán</th><th>Hỏng</th><th>Phải thu</th></tr>${[...db.recs].reverse().map(x=>`<tr><td>${x.date}</td><td>${sn(x.sid)}</td><td>${pn(x.pid)}</td><td>${x.sold}</td><td>${x.broken}</td><td>${money(x.due)}</td></tr>`).join("")}</table></div>`;
if(page=="Thu tiền")h=`<h2>Thu tiền & công nợ</h2><div class=panel><div class=form><select id=psid>${opts(db.stores,x=>x.name)}</select><input id=pamt type=number placeholder="Số tiền thu"><button class=primary onclick=pay()>Ghi nhận thu</button></div></div><div class=cards>${db.stores.filter(x=>x.debt>0).map(x=>card(x.name,money(x.debt),"red")).join("")||card("Công nợ","0đ","green")}</div>`;
if(page=="Báo cáo"){let retail=db.recs.reduce((a,x)=>a+x.retail,0),shares=db.recs.reduce((a,x)=>a+x.share,0),cost=db.recs.reduce((a,x)=>a+x.cost,0);h=`<h2>Báo cáo kinh doanh</h2><div class=cards>${card("Doanh thu bán lẻ",money(retail))+card("Điểm bán hưởng",money(shares))+card("TV TƯỢNG phải thu",money(retail-shares))+card("Giá vốn đã bán",money(cost))+card("Lãi đóng góp",money(retail-shares-cost),"green")+card("Công nợ còn lại",money(debt),"red")+card("Đã thu",money(paid))}</div>`}
if(page=="Kết nối")h=`<h2>Kết nối Supabase</h2><div class=panel><h3>🔐 Bước 1 — Kết nối dữ liệu</h3><div class=form><input id=sburl value="${SB_URL}" readonly><input id=sbkey type=password placeholder="Dán Publishable key: sb_publishable_..."><button class=primary onclick=saveSupabase()>Lưu & kiểm tra</button></div><div id=sbstatus class=note>${sbKey()?"✅ Thiết bị đã có Publishable key. Có thể kiểm tra kết nối.":"Publishable key chỉ lưu trên trình duyệt này. Không nhập Secret key / service_role."}</div></div><br><div class=panel><h3>👤 Bước 2 — Đăng nhập</h3><div class=form><input id=sbemail type=email placeholder="Email"><input id=sbpass type=password placeholder="Mật khẩu"><button class=primary onclick=loginSB()>Đăng nhập & đồng bộ</button><button class=secondary onclick=logoutSB()>Đăng xuất</button></div><div class=note>Đăng nhập bằng tài khoản Supabase Auth. Sau khi đăng nhập, app đọc danh mục sản phẩm từ bảng products.</div></div>`;
if(page=="Dữ liệu")h=`<h2>Sao lưu dữ liệu</h2><div class=panel><div class=toolbar><button class=primary onclick=backup()>⬇ Xuất backup JSON</button><button class=danger onclick=resetDB()>Khôi phục dữ liệu mẫu</button></div><div class=note>V2 lưu trên trình duyệt của thiết bị. Bản triển khai online tiếp theo sẽ kết nối Supabase để đồng bộ nhiều điện thoại/máy tính và đăng nhập người dùng.</div></div>`;
main.innerHTML=h}
function addProduct(){if(!name.value)return alert("Nhập tên sản phẩm");db.products.push({id:Date.now(),code:code.value||"SP-"+Date.now(),name:name.value,cat:cat.value,unit:unit.value,cost:+cost.value||0,price:+price.value||0,share:+share.value||0,stock:0,min:+min.value||0});save()}
function delProduct(id){if(db.combos.some(c=>c.bom.some(b=>b.pid==id)))return alert("Sản phẩm đang nằm trong Combo, chưa thể xóa.");if(confirm("Xóa sản phẩm này?")){db.products=db.products.filter(x=>x.id!=id);save()}}
function receipt(){let x=p(+rpid.value),q=+rqty.value||0;if(q<=0)return alert("Nhập số lượng");x.stock+=q;db.receipts.push({date:today(),pid:x.id,qty:q,type:rtype.value,note:rsupplier.value});save()}
function addStore(){if(!sname.value)return alert("Nhập tên điểm bán");db.stores.push({id:Date.now(),name:sname.value,area:area.value,phone:phone.value,debt:0});save()}
function addRack(){if(!rcode.value)return alert("Nhập mã kệ");db.racks.push({id:Date.now(),code:rcode.value,sid:+ksid.value,value:+kvalue.value||0,dep:+kdep.value||0});save()}
function move(){let x=p(+mpid.value),q=+mqty.value||0;if(q<=0||q>x.stock)return alert("Số lượng không hợp lệ hoặc kho không đủ");x.stock-=q;let k=msid.value+"-"+x.id;db.ss[k]=(db.ss[k]||0)+q;db.moves.push({date:today(),sid:+msid.value,pid:x.id,qty:q});save()}
function reconcile(){let sid=+osid.value,pid=+opid.value,sold=+osold.value||0,broken=+obroken.value||0,k=sid+"-"+pid,held=db.ss[k]||0;if(sold+broken>held)return alert("Số bán + hỏng vượt tồn ký gửi tại điểm.");let x=p(pid),due=sold*(x.price-x.share);db.ss[k]=held-sold-broken;db.stores.find(s=>s.id==sid).debt+=due;db.recs.push({date:today(),sid,pid,sold,broken,due,retail:sold*x.price,share:sold*x.share,cost:sold*x.cost});save()}
function pay(){let s=db.stores.find(x=>x.id==+psid.value),a=+pamt.value||0;if(a<=0)return alert("Nhập số tiền");s.debt=Math.max(0,s.debt-a);db.pays.push({date:today(),sid:s.id,amount:a});save()}
function buildCombo(){let c=db.combos.find(x=>x.id==+cbid.value),q=+cbqty.value||0;if(q<=0)return alert("Nhập số combo");for(let b of c.bom)if(p(b.pid).stock<b.qty*q)return alert("Không đủ "+pn(b.pid));c.bom.forEach(b=>p(b.pid).stock-=b.qty*q);alert("Đã trừ vật tư để đóng "+q+" "+c.name+". V2.1 sẽ tạo tồn kho Combo thành phẩm.");save()}
async function saveSupabase(){let k=sbkey.value.trim();if(!k.startsWith("sb_publishable_"))return alert("Chỉ dán Publishable key bắt đầu bằng sb_publishable_. Không dán Secret key.");localStorage.setItem("tvtuong-supabase-url",SB_URL);localStorage.setItem("tvtuong-supabase-publishable",k);sbkey.value="";sbstatus.innerHTML="⏳ Đang kiểm tra kết nối...";let r=await testSB();sbstatus.innerHTML=(r.ok?"<b>✅ ":"<b>⚠️ ")+r.msg+"</b>"+(r.ok?"<br>Có thể chuyển sang bước đăng nhập.":"<br>Nếu báo permission denied/RLS, cần cấu hình policy trước.");}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="tv-tuong-v2-backup.json";a.click()}
function resetDB(){if(confirm("Khôi phục dữ liệu mẫu?")){db=clone(seed);save()}}
render();
</script></body></html>
