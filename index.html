"use strict";

const SB_URL = "https://upropxmltqqexvtnuerg.supabase.co";
// Publishable key: loại khóa CÔNG KHAI dành cho frontend (được bảo vệ bởi đăng nhập + RLS). Không phải secret.
const SB_PUBLISHABLE = "sb_publishable_1r1pPXDHh8Vr3r5LDy6AEw_V03DUmkG";
const AI_DEFAULT = "https://tv-tuong-ai.vohongthang476.workers.dev";
const MENUS = ["🤖 Trợ lý AI","Tổng quan","Sản phẩm","Nhập kho","Kho","Combo","Điểm bán","Kệ","Ký gửi","Đối soát","Thu tiền","Báo cáo","Dữ liệu","Kết nối","⚙️ AI"];
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};


const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Math.round(+n || 0).toLocaleString("vi-VN") + "đ";
const fnum = n => (+n || 0).toLocaleString("vi-VN");
const dt = s => s ? new Date(s).toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const dOnly = s => s ? new Date(s).toLocaleDateString("vi-VN") : "";
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]+/g," ").trim();
const daysAgo = s => s ? Math.floor((Date.now() - new Date(s).getTime()) / 864e5) : null;
function md(t){ // markdown tối giản an toàn
  let h = esc(t);
  h = h.replace(/[*]{2}(.+?)[*]{2}/g,"<b>$1</b>").replace(/(^|\n)#{1,4}\s*(.+)/g,"$1<b>$2</b>").replace(/(^|\n)\s*[-*]\s+/g,"$1• ");
  return h.replace(/\n/g,"<br>");
}
function toast(msg, kind="info"){ const n=document.createElement("div"); n.className="note "+kind; n.style.cssText="position:fixed;left:12px;right:12px;bottom:14px;z-index:99;max-width:560px;margin:auto;box-shadow:0 6px 24px #0003"; n.innerHTML=msg; document.body.appendChild(n); setTimeout(()=>n.remove(), kind==="err"?7000:3500); }
function friendlyDbError(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/JWT|expired|not authenticated|401/i.test(m)) return "Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại ở tab Kết nối.";
  if (/permission denied|row-level security|42501/i.test(m)) return "Không có quyền ghi dữ liệu (RLS). Hãy đăng nhập lại.";
  if (/Failed to fetch|NetworkError|network/i.test(m)) return "Mất kết nối mạng tới Supabase. Kiểm tra Internet rồi thử lại.";
  if (/function .* does not exist|PGRST202/i.test(m)) return "Chưa có hàm nghiệp vụ trên Supabase (tv_...). Cần cài đặt hàm trước.";
  return m;
}


let sb = null, user = null, loading = false, lastLoad = 0, loadErr = "";
const S = { products:[], categories:[], stores:[], racks:[], inv:[], comboItems:[], suppliers:[], receipts:[], consigns:[], recs:[], pays:[], moves:[], aiLog:[] };
function initSB(){
  if (sb) return true;
  try {
    if (!window.supabase) throw new Error("Không tải được thư viện Supabase (kiểm tra mạng).");
    sb = window.supabase.createClient(SB_URL, SB_PUBLISHABLE, { auth: { persistSession: true, autoRefreshToken: true } });
    sb.auth.onAuthStateChange((ev, session) => { const u = session?.user || null; const changed = (u?.id||"") !== (user?.id||""); user = u; if (changed) setTimeout(() => { if (user) loadAll(); else render(); }, 0); });
    return true;
  } catch (e) { loadErr = e.message; return false; }
}
async function q(p){ const { data, error } = await p; if (error) throw error; return data || []; }
async function loadAll(silent){
  if (!user || loading) return; loading = true; loadErr = "";
  if (!silent) render();
  try {
    const since = new Date(Date.now() - 120*864e5).toISOString();
    const [products, categories, stores, racks, inv, comboItems, suppliers, receipts, consigns, recs, pays, moves, aiLog] = await Promise.all([
      q(sb.from("products").select("*, product_categories(name)").order("sku")),
      q(sb.from("product_categories").select("*").order("name")),
      q(sb.from("stores").select("*").order("name")),
      q(sb.from("racks").select("*").order("code")),
      q(sb.from("store_inventory").select("*")),
      q(sb.from("combo_items").select("*")),
      q(sb.from("suppliers").select("*").order("name")),
      q(sb.from("stock_receipts").select("*, suppliers(name), stock_receipt_items(*)").order("created_at",{ascending:false}).limit(100)),
      q(sb.from("consignments").select("*, consignment_items(*)").order("created_at",{ascending:false}).limit(200)),
      q(sb.from("reconciliations").select("*, reconciliation_items(*)").order("created_at",{ascending:false}).limit(500)),
      q(sb.from("payments").select("*").order("created_at",{ascending:false}).limit(500)),
      q(sb.from("stock_movements").select("product_id,movement_type,quantity,location_id,created_at").gte("created_at", since).order("created_at",{ascending:false}).limit(3000)),
      q(sb.from("ai_commands").select("*").order("created_at",{ascending:false}).limit(60)),
    ]);
    Object.assign(S, { products, categories, stores, racks, inv, comboItems, suppliers, receipts, consigns, recs, pays, moves, aiLog });
    lastLoad = Date.now();
  } catch (e) { loadErr = friendlyDbError(e); }
  loading = false; render();
}
const P = id => S.products.find(x => x.id === id);
const ST = id => S.stores.find(x => x.id === id);
const pName = id => P(id)?.name || "(SP đã xóa)";
const sName = id => ST(id)?.name || "(CH đã xóa)";
const isCombo = p => p && p.source_type === "combo";
const comboParts = id => S.comboItems.filter(c => c.combo_product_id === id);
const catName = p => p?.product_categories?.name || "";
const heldAt = sid => S.inv.filter(i => i.store_id === sid && +i.quantity > 0);
const heldQty = (sid, pid) => +(S.inv.find(i => i.store_id === sid && i.product_id === pid)?.quantity || 0);
const heldTotalProduct = pid => S.inv.filter(i => i.product_id === pid).reduce((a, i) => a + +i.quantity, 0);
function canBuild(cid){ const parts = comboParts(cid); if (!parts.length) return 0; return Math.min(...parts.map(c => Math.floor(+(P(c.component_product_id)?.stock||0) / +c.quantity))); }


function analytics(){
  const now = Date.now(), d30 = now - 30*864e5, monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();
  const items = S.recs.flatMap(r => (r.reconciliation_items||[]).map(i => ({...i, store_id:r.store_id, created_at:r.created_at})));
  const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
  const month = items.filter(i => new Date(i.created_at).getTime() >= monthStart);
  const k = arr => ({ retail: sum(arr, i => i.sold_qty*i.retail_price), share: sum(arr, i => i.sold_qty*i.store_share), due: sum(arr, i => +i.amount_due), cost: sum(arr, i => i.sold_qty*i.cost), sold: sum(arr, i => +i.sold_qty), broken: sum(arr, i => +i.broken_qty) });
  const all = k(items), mon = k(month);
  const sold30 = {}; items.filter(i => new Date(i.created_at).getTime() >= d30).forEach(i => sold30[i.product_id] = (sold30[i.product_id]||0) + +i.sold_qty);
  const lastOut = {}; S.moves.forEach(m => { if (+m.quantity < 0 && !lastOut[m.product_id]) lastOut[m.product_id] = m.created_at; });
  const active = S.products.filter(p => p.active !== false);
  const low = active.filter(p => +p.stock <= +p.min_stock && !(isCombo(p) && +p.min_stock === 0));
  const idle = active.filter(p => +p.stock > 0 && daysAgo(p.created_at) > 30 && (!lastOut[p.id] || daysAgo(lastOut[p.id]) > 30));
  const lastRec = {}, lastCons = {};
  S.recs.forEach(r => { if (!lastRec[r.store_id]) lastRec[r.store_id] = r.created_at; });
  S.consigns.forEach(c => { if (!lastCons[c.store_id]) lastCons[c.store_id] = c.created_at; });
  const debtors = S.stores.filter(s => +s.debt > 0).sort((a, b) => b.debt - a.debt);
  const storeRows = S.stores.filter(s => s.active !== false).map(s => {
    const held = heldAt(s.id).reduce((a, i) => a + +i.quantity, 0);
    const sold = sum(items.filter(i => i.store_id === s.id && new Date(i.created_at).getTime() >= d30), i => +i.sold_qty);
    return { id:s.id, name:s.name, area:s.area, debt:+s.debt, held, sold30:sold, racks:S.racks.filter(r => r.store_id === s.id && r.status === "assigned").length, lastRec:lastRec[s.id], lastCons:lastCons[s.id] };
  });
  const restock = storeRows.filter(r => r.lastCons && (r.held <= 5 || (r.sold30 > 0 && r.held < r.sold30 * 0.5)));
  const overdueRec = storeRows.filter(r => r.held > 0 && (!r.lastRec || daysAgo(r.lastRec) > 14) && r.lastCons && daysAgo(r.lastCons) > 7);
  const paid = sum(S.pays, p => +p.amount), paidMonth = sum(S.pays.filter(p => new Date(p.created_at).getTime() >= monthStart), p => +p.amount);
  const brokenRate = all.sold + all.broken > 0 ? all.broken / (all.sold + all.broken) : 0;
  return { all, mon, sold30, lastOut, low, idle, debtors, storeRows, restock, overdueRec, paid, paidMonth, brokenRate, items };
}
function alertsList(a){
  const out = [];
  a.low.forEach(p => out.push(["e", `Sắp hết: <b>${esc(p.name)}</b> còn ${fnum(p.stock)} ${esc(p.unit)} (tối thiểu ${fnum(p.min_stock)})`]));
  a.debtors.slice(0,5).forEach(s => out.push(["w", `Công nợ: <b>${esc(s.name)}</b> ${money(s.debt)}`]));
  a.restock.forEach(r => out.push(["i", `Nên bổ sung hàng: <b>${esc(r.name)}</b> (đang giữ ${fnum(r.held)}, bán 30 ngày ${fnum(r.sold30)})`]));
  a.overdueRec.forEach(r => out.push(["w", `Lâu chưa đối soát: <b>${esc(r.name)}</b> (${r.lastRec ? daysAgo(r.lastRec) + " ngày" : "chưa từng"})`]));
  a.idle.slice(0,5).forEach(p => out.push(["i", `Tồn lâu (>30 ngày không xuất): <b>${esc(p.name)}</b> ${fnum(p.stock)} ${esc(p.unit)}`]));
  if (a.brokenRate > 0.05) out.push(["w", `Tỷ lệ hỏng/vỡ ${(a.brokenRate*100).toFixed(1)}% — cao hơn mức 5%`]);
  return out;
}


function aiContext(){
  const a = analytics();
  return {
    ngay: new Date().toLocaleDateString("vi-VN"),
    san_pham: S.products.filter(p => p.active !== false).map(p => ({ sku:p.sku, ten:p.name, nhom:catName(p), dvt:p.unit, loai:p.source_type, ton_kho:+p.stock, ton_toi_thieu:+p.min_stock, gia_ban:+p.retail_price, diem_ban_huong:+p.store_share, gia_von:+p.cost, dang_o_diem_ban:heldTotalProduct(p.id), ban_30_ngay:a.sold30[p.id]||0, xuat_gan_nhat:a.lastOut[p.id]?dOnly(a.lastOut[p.id]):null,
      ...(isCombo(p) ? { thanh_phan: comboParts(p.id).map(c => ({ sku:P(c.component_product_id)?.sku, sl:+c.quantity })), co_the_dong_them: canBuild(p.id) } : {}) })),
    cua_hang: S.stores.filter(s => s.active !== false).map(s => { const r = a.storeRows.find(x => x.id === s.id) || {}; return { ten:s.name, khu_vuc:s.area, dien_thoai:s.phone, cong_no:+s.debt, so_ke:r.racks, hang_dang_giu:heldAt(s.id).map(i => ({ sku:P(i.product_id)?.sku, ten:pName(i.product_id), sl:+i.quantity })), ban_30_ngay:r.sold30, giao_gan_nhat:r.lastCons?dOnly(r.lastCons):null, doi_soat_gan_nhat:r.lastRec?dOnly(r.lastRec):null }; }),
    ke: S.racks.map(r => ({ ma:r.code, trang_thai:r.status, cua_hang:r.store_id?sName(r.store_id):null, gia_tri:+r.asset_value, coc:+r.deposit })),
    tong_hop: { tong_cong_no: a.debtors.reduce((x, s) => x + +s.debt, 0), doanh_thu_ban_le_thang: a.mon.retail, phai_thu_thang: a.mon.due, lai_gop_thang: a.mon.due - a.mon.cost, da_thu_thang: a.paidMonth, doanh_thu_ban_le_tat_ca: a.all.retail, ty_le_hong: +(a.brokenRate*100).toFixed(1) },
    canh_bao: alertsList(a).map(x => x[1].replace(/<[^>]+>/g,"")),
    nha_cung_cap: S.suppliers.map(s => s.name),
  };
}


function aiCfg(){
  let e = LS.get("tvt-ai-endpoint", "") || AI_DEFAULT;
  if (!/^https:\/\//i.test(e)) e = AI_DEFAULT;
  return { provider: LS.get("tvt-ai-provider","gemini"), model: LS.get("tvt-ai-model",""), endpoint: e.replace(/\/+$/,"") };
}
async function callAI(payload){
  const cfg = aiCfg(); let r;
  try { r = await fetch(cfg.endpoint, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ provider:cfg.provider, model:cfg.model, ...payload }) }); }
  catch (e) { throw new Error("Không kết nối được máy chủ AI. Kiểm tra mạng Internet (hoặc URL backend ở tab ⚙️ AI)."); }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok || j.ok === false) {

  const url = await readAs(file, "readAsDataURL");

async function prepFile(file){
  const n = file.name.toLowerCase();

    await loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js");
    const wb = XLSX.read(await readAs(file, "readAsArrayBuffer"), { type:"array" });
    const t = wb.SheetNames.map(s => "### Sheet: " + s + "\n" + XLSX.utils.sheet_to_csv(wb.Sheets[s])).join("\n\n");
    return { name:file.name, type:"text/csv", text: t.slice(0, 60000), note:"Excel" };

}

  else if (s.status === "running") foot = `<div class="mut typing">⏳ Đang ghi dữ liệu…</div>`;

  return `<div class="act ${cls}" id="act-${a.key}"><h4>🧠 AI đã hiểu: ${esc(ACT_LABEL[a.type] || a.type)} ${conf}</h4>${low && s.status === "pending" ? `<div class="warn"><b>Kiểm tra kỹ trước khi xác nhận</b> — các ô viền đỏ cần chọn/điền.</div>` : ""}${warn}${body}${foot}</div>`;

function findAct(key){ for (const m of chat) for (const a of (m.actions||[])) if (a.key === key) return a; return null; }
function setP(key, path, val, type){
  const a = findAct(key); if (!a) return;
  if (type === "number") val = val === "" ? null : +val;
  const parts = path.split("."); let o = a.p; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts.at(-1)] = val; saveChat(); rerenderAct(a);
}
function rerenderAct(a){ const el = $("act-" + a.key); if (el) el.outerHTML = actionCard(a); }
async function logAction(a){
  if (!user) return;
  try { const { data, error } = await sb.from("ai_commands").insert({ command_text: a.cmd || ACT_LABEL[a.type], action_type: a.type, parsed_data: { params: a.p, confidence: a.confidence, warnings: a.warnings }, status: "pending" }).select("id").single(); if (!error) { a.logId = data.id; saveChat(); } } catch (e) {}
}
async function updLog(a, status, result){ if (!a.logId) return; try { const patch = { status, result: result ?? null }; if (status === "confirmed") patch.confirmed_at = new Date().toISOString(); if (status === "executed" || status === "failed") patch.executed_at = new Date().toISOString(); await sb.from("ai_commands").update(patch).eq("id", a.logId); } catch (e) {} }
function cancelAction(key){ const a = findAct(key); if (!a) return; actState[key] = { status:"cancelled" }; a.status = "cancelled"; updLog(a, "cancelled"); saveChat(); rerenderAct(a); }
function retryAction(key){ const a = findAct(key); if (!a) return; actState[key] = { status:"pending" }; a.status = "pending"; saveChat(); rerenderAct(a); }


function validate(a){
  const p = a.p, e = [];
  const needItems = (arr, f) => { if (!arr || !arr.length) e.push("Chưa có dòng hàng."); (arr||[]).forEach((it, i) => f(it, i)); };
  switch (a.type) {
    case "stock_in": needItems(p.items, (it, i) => { if (it.product_id === "__skip__") return; if (!it.product_id) e.push(`Dòng ${i+1}: chưa chọn sản phẩm.`); if (!(+it.qty > 0)) e.push(`Dòng ${i+1}: số lượng phải > 0.`); if (+it.unit_cost < 0) e.push(`Dòng ${i+1}: đơn giá âm.`); });
      if ((p.items||[]).every(it => it.product_id === "__skip__")) e.push("Tất cả dòng đều bị bỏ qua."); break;
    case "consign": if (!p.store_id) e.push("Chưa chọn cửa hàng."); needItems(p.items, (it, i) => { const pr = P(it.product_id); if (!pr) return e.push(`Dòng ${i+1}: chưa chọn sản phẩm.`); if (!(+it.qty > 0)) e.push(`Dòng ${i+1}: số lượng phải > 0.`); const avail = +pr.stock + (isCombo(pr) ? canBuild(pr.id) : 0); if (+it.qty > avail) e.push(`${pr.name}: kho chỉ đủ ${avail}.`); }); break;
    case "reconcile": if (!p.store_id) e.push("Chưa chọn cửa hàng."); needItems(p.items, (it, i) => { if (!it.product_id) return e.push(`Dòng ${i+1}: chưa chọn sản phẩm.`); const t = (+it.sold_qty||0) + (+it.broken_qty||0) + (+it.returned_qty||0); if ([it.sold_qty,it.broken_qty,it.returned_qty].some(v => +v < 0)) e.push(`Dòng ${i+1}: số âm.`); if (t > heldQty(p.store_id, it.product_id)) e.push(`${pName(it.product_id)}: bán+hỏng+trả vượt số đang giữ (${heldQty(p.store_id, it.product_id)}).`); }); break;
    case "record_payment": { if (!p.store_id) e.push("Chưa chọn cửa hàng."); if (!(+p.amount > 0)) e.push("Số tiền phải > 0."); const s = ST(p.store_id); if (s && +p.amount > +s.debt) e.push(`Số tiền lớn hơn công nợ (${money(s.debt)}).`); break; }
    case "create_store": if (!String(p.name||"").trim()) e.push("Chưa có tên cửa hàng."); break;
    case "create_product": if (!String(p.name||"").trim()) e.push("Chưa có tên sản phẩm."); break;
    case "create_combo": if (!String(p.name||"").trim()) e.push("Chưa có tên combo."); if (!(p.components||[]).length) e.push("Chưa có thành phần."); (p.components||[]).forEach((c, i) => { if (!c.product_id) e.push(`Thành phần ${i+1}: chưa chọn.`); if (!(+c.qty > 0)) e.push(`Thành phần ${i+1}: định mức > 0.`); }); break;
    case "build_combo": if (!p.combo_id) e.push("Chưa chọn combo."); if (!(+p.qty > 0)) e.push("Số lượng phải > 0."); else if (p.combo_id && +p.qty > canBuild(p.combo_id)) e.push(`Vật tư chỉ đủ đóng ${canBuild(p.combo_id)} combo.`); break;
    case "assign_rack": if (!String(p.code||"").trim()) e.push("Chưa có mã kệ."); if (!p.store_id) e.push("Chưa chọn cửa hàng."); break;
    default: e.push("Thao tác không được hỗ trợ.");
  }
  return e;
}
async function rpc(fn, p){ const { data, error } = await sb.rpc(fn, { p }); if (error) throw error; return data; }
async function execute(a){
  const p = a.p;
  switch (a.type) {
    case "stock_in": {
      const items = [];
      for (const it of p.items) {
        if (it.product_id === "__skip__") continue;
        let pid = it.product_id;
        if (pid === "__new__") { const r = await rpc("tv_create_product", { name: it.name_on_doc || it.product_sku, cost: +it.unit_cost || 0, category: "Khác", unit: it.unit || "cái", source_type: p.receipt_type === "production" ? "manufactured" : "purchased" }); pid = r.product_id; }
        items.push({ product_id: pid, qty: +it.qty, unit_cost: +it.unit_cost || 0 });
      }
      const note = [p.doc_no ? "Số CT " + p.doc_no : "", p.doc_date ? "Ngày CT " + p.doc_date : "", p.note || "", a.logId ? "(Trợ lý AI)" : ""].filter(Boolean).join(" • ");
      const r = await rpc("tv_stock_in", { receipt_type: p.receipt_type || "production", supplier: p.supplier || "", note, items });
      return { r, msg: `Đã nhập ${r.lines} dòng hàng${r.total ? ", giá trị " + money(r.total) : ""}.` };
    }
    case "consign": { const r = await rpc("tv_consign", { store_id: p.store_id, note: p.note || "", auto_build: true, items: p.items.map(it => ({ product_id: it.product_id, qty: +it.qty })) }); return { r, msg: `Đã giao cho ${r.store}.` + ((r.auto_built||[]).length ? " Tự đóng thêm: " + r.auto_built.map(b => b.qty + " " + b.combo).join(", ") + "." : "") }; }
    case "reconcile": { const r = await rpc("tv_reconcile", { store_id: p.store_id, note: p.note || "", items: p.items.map(it => ({ product_id: it.product_id, sold_qty: +it.sold_qty||0, broken_qty: +it.broken_qty||0, returned_qty: +it.returned_qty||0 })) }); return { r, msg: `Phải thu thêm ${money(r.amount_due)} • Công nợ mới ${money(r.new_debt)}.` }; }
    case "record_payment": { const r = await rpc("tv_record_payment", { store_id: p.store_id, amount: +p.amount, method: p.method || "cash", note: p.note || "" }); return { r, msg: `Công nợ còn ${money(r.new_debt)}.` }; }
    case "create_store": { const r = await rpc("tv_create_store", p); return { r, msg: `Đã thêm cửa hàng ${r.name}.` }; }
    case "create_product": { const r = await rpc("tv_create_product", p); return { r, msg: `Mã ${r.sku}.` }; }
    case "create_combo": { const r = await rpc("tv_create_combo", { ...p, components: p.components.map(c => ({ product_id: c.product_id, qty: +c.qty })) }); return { r, msg: `Mã ${r.sku}, giá vốn ${money(r.cost)}.` }; }
    case "build_combo": { const r = await rpc("tv_build_combo", { combo_id: p.combo_id, qty: +p.qty }); return { r, msg: `Đã đóng ${r.qty} combo.` }; }
    case "assign_rack": { const r = await rpc("tv_assign_rack", { code: p.code, store_id: p.store_id, asset_value: p.asset_value, deposit: p.deposit, note: p.note }); return { r, msg: `Kệ ${r.code}.` }; }
  }
}
async function confirmAction(key){
  const a = findAct(key); if (!a) return;
  if (!user) return toast("Cần đăng nhập ở tab Kết nối.", "err");
  const errs = validate(a);
  if (errs.length) { toast("⚠️ " + errs.map(esc).join("<br>"), "err"); return; }
  actState[key] = { status:"running" }; rerenderAct(a);
  await updLog(a, "confirmed");
  try {
    const { r, msg } = await execute(a);
    actState[key] = { status:"done", msg }; a.status = "done";
    await updLog(a, "executed", r);
    await loadAll(true);
  } catch (e) {
    const m = friendlyDbError(e); actState[key] = { status:"failed", error: m }; a.status = "failed";
    await updLog(a, "failed", { error: m });
  }
  saveChat(); if (page === "🤖 Trợ lý AI") renderMsgs(); else rerenderAct(a);
}

function manualAction(type, p){
  const a = prepareAction({ type, params: p, confidence: 1, warnings: [] }, "Nhập tay: " + ACT_LABEL[type]);
  Object.assign(a.p, p);
  const errs = validate(a); if (errs.length) return toast("⚠️ " + errs.map(esc).join("<br>"), "err");
  actState[a.key] = { status:"running" };
  (async () => { try { const { msg } = await execute(a); toast("✅ " + esc(ACT_LABEL[type]) + ": " + esc(msg), "good"); await loadAll(true); } catch (e) { toast("❌ " + esc(friendlyDbError(e)), "err"); } })();
}

async function editProduct(id){
  const p = P(id); if (!p) return;

  if (v === null) return; const n = v.split(/[;,]/).map(x => +x.trim());
  if (n.length !== 4 || n.some(x => isNaN(x) || x < 0)) return toast("Nhập đủ 4 số không âm, cách nhau bằng dấu ;", "err");
  const { error } = await sb.from("products").update({ cost:n[0], retail_price:n[1], store_share:n[2], min_stock:n[3] }).eq("id", id);
  if (error) return toast("❌ " + esc(friendlyDbError(error)), "err"); toast("✅ Đã cập nhật giá", "good"); loadAll(true);
}

  const a = analytics(), all = a.all, mon = a.mon;
  const byStore = {}, byProd = {};
  a.items.forEach(i => { const s = byStore[i.store_id] ||= { sold:0, retail:0, due:0 }; s.sold += +i.sold_qty; s.retail += i.sold_qty * i.retail_price; s.due += +i.amount_due; const p = byProd[i.product_id] ||= { sold:0, broken:0, due:0, cost:0 }; p.sold += +i.sold_qty; p.broken += +i.broken_qty; p.due += +i.amount_due; p.cost += i.sold_qty * i.cost; });
  return `<h2>Báo cáo kinh doanh</h2><h3>Tháng này</h3><div class="cards">${card("Doanh thu bán lẻ", money(mon.retail)) + card("Điểm bán hưởng", money(mon.share)) + card("TV TƯỢNG phải thu", money(mon.due)) + card("Giá vốn", money(mon.cost)) + card("Lãi gộp", money(mon.due - mon.cost), "green") + card("Đã thu", money(a.paidMonth))}</div>
  <h3 style="margin-top:16px">Từ trước đến nay</h3><div class="cards">${card("Doanh thu bán lẻ", money(all.retail)) + card("Phải thu", money(all.due)) + card("Lãi gộp", money(all.due - all.cost), "green") + card("Đã thu", money(a.paid)) + card("Công nợ còn", money(a.debtors.reduce((x, s) => x + +s.debt, 0)), "red") + card("Tỷ lệ hỏng", (a.brokenRate*100).toFixed(1) + "%", a.brokenRate > 0.05 ? "red" : "")}</div>
  <h3 style="margin-top:16px">Theo cửa hàng</h3>${tbl(["Cửa hàng","Đã bán","Doanh thu lẻ","Phải thu","Công nợ"], Object.entries(byStore).sort((x, y) => y[1].due - x[1].due).map(([id, v]) => `<tr><td>${esc(sName(id))}</td><td>${fnum(v.sold)}</td><td>${money(v.retail)}</td><td>${money(v.due)}</td><td>${money(ST(id)?.debt)}</td></tr>`))}
  <h3 style="margin-top:16px">Theo sản phẩm</h3>${tbl(["Sản phẩm","Đã bán","Hỏng","Phải thu","Lãi gộp"], Object.entries(byProd).sort((x, y) => y[1].sold - x[1].sold).map(([id, v]) => `<tr><td>${esc(pName(id))}</td><td>${fnum(v.sold)}</td><td>${fnum(v.broken)}</td><td>${money(v.due)}</td><td>${money(v.due - v.cost)}</td></tr>`))}`;
}
function pageData(){
  const old = LS.get("tvtuong-v2", null);
  return `<h2>Dữ liệu</h2><div class="panel"><h3>☁️ Dữ liệu chính: Supabase</h3><div class="mut">Mọi thao tác được lưu trên Supabase, đồng bộ mọi thiết bị đăng nhập cùng tài khoản. Lần tải gần nhất: ${lastLoad ? dt(lastLoad) : "—"}.</div>
  <div class="toolbar"><button class="primary" onclick="backupAll()">⬇ Xuất backup toàn bộ (JSON)</button><button class="secondary" onclick="loadAll()">⟳ Tải lại dữ liệu</button></div></div>
  <div class="panel"><h3>🤖 Nhật ký lệnh AI</h3>${tbl(["Thời gian","Lệnh","Loại","Trạng thái"], S.aiLog.map(l => `<tr><td>${dt(l.created_at)}</td><td>${esc((l.command_text || "").slice(0, 80))}</td><td>${esc(ACT_LABEL[l.action_type] || l.action_type || "")}</td><td><span class="badge ${{ executed:"", failed:"e", cancelled:"i", pending:"w", confirmed:"w" }[l.status]}">${{ executed:"Đã thực hiện", failed:"Lỗi", cancelled:"Đã hủy", pending:"Chờ xác nhận", confirmed:"Đang chạy" }[l.status] || l.status}</span></td></tr>`), "Chưa có lệnh AI.")}</div>
  ${old ? `<div class="panel"><h3>💾 Dữ liệu bản cũ trên máy này</h3><div class="mut">Bản cũ lưu trong trình duyệt (${(old.products||[]).length} SP, ${(old.stores||[]).length} điểm bán, ${(old.moves||[]).length} lượt giao). Không bị xóa. Có thể tải về để đối chiếu.</div><div class="toolbar"><button class="secondary" onclick="dl('tv-tuong-ban-cu.json', localStorage.getItem('tvtuong-v2'))">⬇ Tải dữ liệu bản cũ</button></div></div>` : ""}`;
}
function dl(name, text){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type:"application/json" })); a.download = name; a.click(); }
function backupAll(){ dl("tv-tuong-backup-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify({ exported_at: new Date().toISOString(), ...S }, null, 2)); }
function pageConnect(){
  return `<h2>Kết nối Supabase</h2><div class="panel"><h3>${user ? "✅ Đã đăng nhập" : "🔐 Đăng nhập"}</h3>
  ${user ? `<div>Tài khoản: <b>${esc(user.email)}</b></div><div class="mut">Máy chủ: ${esc(SB_URL)} • ${S.products.length} sản phẩm, ${S.stores.length} điểm bán</div><div class="toolbar"><button class="secondary" onclick="loadAll()">⟳ Kiểm tra & tải lại</button><button class="danger" onclick="doLogout()">Đăng xuất</button></div>` : `<div class="mut">Dùng tài khoản Supabase Auth của TV TƯỢNG.</div>${loginForm()}`}
  ${loadErr ? `<div class="note err">⚠️ ${esc(loadErr)}</div>` : ""}</div>
  <div class="note info">🔒 Website chỉ dùng <b>Publishable key</b> (khóa công khai). Không bao giờ nhập Secret key / service_role vào đây.</div>`;
}
function pageAI(){
  const c = aiCfg();
  return `<h2>⚙️ Cấu hình Trợ lý AI</h2><div class="panel"><div class="form"><div><label>Nhà cung cấp</label><select id="ai_p">${[["gemini","Gemini (đang dùng)"],["openai","OpenAI"],["grok","Grok (xAI)"]].map(([v,l]) => `<option value="${v}" ${c.provider === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
  <div><label>Model (để trống = tự chọn tốt nhất)</label><input id="ai_m" value="${esc(c.model)}" placeholder="Tự động"></div><div><label>URL backend AI</label><input id="ai_e" value="${esc(c.endpoint)}"></div>
  <button class="primary" onclick="saveAI()">Lưu</button><button class="secondary" onclick="testAI()">Kiểm tra AI</button></div>
  <div id="ai_st" class="note info">API key được lưu an toàn trong Cloudflare (Secret), không nằm trên website.</div>
  <div class="toolbar"><button class="secondary" onclick="listModels()">Xem model Gemini khả dụng</button><button class="secondary" onclick="LS.set('tvt-ai-model','');LS.set('tvt-ai-provider','gemini');LS.set('tvt-ai-endpoint','');render()">Khôi phục mặc định</button></div></div>`;
}
function saveAI(){ const e = ai_e.value.trim(); if (!/^https:\/\//i.test(e)) return toast("URL backend phải bắt đầu bằng https:// — không dán API key vào đây.", "err"); if (/AIza|sk-|xai-/.test(ai_m.value + e)) return toast("Có vẻ đây là API key. Không dán key vào website!", "err"); LS.set("tvt-ai-provider", ai_p.value); LS.set("tvt-ai-model", ai_m.value.trim()); LS.set("tvt-ai-endpoint", e === AI_DEFAULT ? "" : e); toast("✅ Đã lưu cấu hình AI", "good"); }
async function testAI(){ const o = $("ai_st"); o.className = "note info"; o.textContent = "⏳ Đang kiểm tra…"; const t0 = Date.now(); try { const j = await callAI({ message:"Chỉ trả lời: Kết nối AI OK", mode:"test" }); o.className = "note good"; o.innerHTML = `✅ AI hoạt động • <b>${esc(j.provider)}</b> • model <b>${esc(j.model)}</b> • ${((Date.now()-t0)/1000).toFixed(1)}s<br>${esc(j.reply || "")}${(j.tried||[]).length ? `<div class="mut">Đã tự bỏ qua: ${esc(j.tried.join("; "))}</div>` : ""}`; } catch (e) { o.className = "note err"; o.textContent = e.message; } }
async function listModels(){ const o = $("ai_st"); o.textContent = "⏳…"; try { const j = await fetch(aiCfg().endpoint + "/models").then(r => r.json()); o.className = j.ok ? "note info" : "note err"; o.innerHTML = j.ok ? `<b>Thứ tự tự chọn:</b> ${esc((j.auto_order||[]).join(", "))}` : esc(j.error); } catch (e) { o.className = "note err"; o.textContent = "Không kết nối được backend AI."; } }


fpick.addEventListener("change", onPick); fcam.addEventListener("change", onPick);
document.addEventListener("paste", ev => { if (page !== "🤖 Trợ lý AI") return; const fs = [...(ev.clipboardData?.files || [])]; if (fs.length) { ev.preventDefault(); onPick({ target: { files: fs, set value(v) {} } }); } });
(async function boot(){
  render();
  if (!initSB()) { render(); return; }
  try { const { data } = await sb.auth.getSession(); user = data.session?.user || null; } catch (e) { loadErr = friendlyDbError(e); }
  if (user) loadAll(); else render();
  setInterval(() => { if (user && document.visibilityState === "visible" && Date.now() - lastLoad > 5*60000) loadAll(true); }, 60000);
})();
</script>
</body>
</html>
